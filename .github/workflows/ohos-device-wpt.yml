# Runs WPT on the DAYU200 board of the self-hosted runner labelled servo-ohos-dayu200, with the
# headless servoshell of `./mach build --ohos --headless-binary`. It tests the configuration of
# GenUI: QuickJS and the RDB storage backend, like `just genui-min`, but with the WebDriver server
# that WPT needs. There are no expectations for OpenHarmony yet, so the tests never fail the run.
#
# Every night, unless servo-ohos-wpt has a run of the ohos-main commit already, it runs the
# nightly subset of WPT and stores the results in openharmony-rs/servo-ohos-wpt as
# `ohos-dayu200-quickjs`. All of WPT would take the board about 14 hours. Otherwise it runs on
# request only: pull requests must not reach the board.
name: OpenHarmony device WPT
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      tests:
        description: "WPT paths, separated by spaces. Empty: the nightly subset"
        type: string
        default: ""
      profile:
        description: "Cargo profile"
        type: choice
        options: ["checked-release", "release"]
        default: "checked-release"
      store:
        description: "Store the results in servo-ohos-wpt (only the nightly subset with checked-release, on ohos-main)"
        type: boolean
        default: false

# The runner has one board. Of several waiting runs, GitHub only keeps the latest.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  RUST_BACKTRACE: 1
  SHELL: /bin/bash
  CARGO_INCREMENTAL: 0
  # The configuration of the stored runs, as in the results job.
  RESULTS_CONFIG: ohos-dayu200-quickjs
  # About 17,500 tests of what generated UI uses: layout, text and fonts, rendering, canvas (for
  # charts), animations, images, forms, touch input, storage and the network. They take the board
  # about four hours. The stored runs have to keep to one subset for their scores to be comparable.
  NIGHTLY_TESTS: >-
    /infrastructure /dom /url /fetch /xhr /eventsource /IndexedDB /webstorage
    /css/css-flexbox /css/css-grid /css/css-text /css/css-text-decor /css/css-fonts
    /css/css-backgrounds /css/css-color /css/css-images /css/css-masking /css/compositing
    /css/filter-effects /css/css-transforms /css/css-animations /css/css-transitions
    /css/css-position /css/mediaqueries /intersection-observer /resize-observer
    /html/canvas/element /html/semantics/embedded-content/the-img-element /html/semantics/forms
    /pointerevents /touch-events /uievents

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      run: ${{ steps.setup.outputs.run }}
      tests: ${{ steps.setup.outputs.tests }}
      profile: ${{ steps.setup.outputs.profile }}
      store: ${{ steps.setup.outputs.store }}
    steps:
      - name: Choose what to run
        id: setup
        env:
          EVENT: ${{ github.event_name }}
          TESTS: ${{ inputs.tests }}
          PROFILE: ${{ inputs.profile || 'checked-release' }}
          STORE: ${{ inputs.store }}
        run: |
          run=true
          store=false
          if [ "$EVENT" = schedule ]; then
            store=true
            # Asks the results, so that a run whose results weren't stored doesn't count.
            git clone --quiet --depth 1 --no-tags https://github.com/openharmony-rs/servo-ohos-wpt results
            git -C results fetch --quiet --no-tags origin "+refs/runs/$RESULTS_CONFIG/*:refs/runs/$RESULTS_CONFIG/*"
            if (cd results && python3 scripts/wpt_store.py tested --config "$RESULTS_CONFIG" "$GITHUB_SHA"); then
              run=false
            fi
          elif [ "$STORE" = true ]; then
            if [ -n "$TESTS" ] || [ "$PROFILE" != checked-release ]; then
              echo "::error::Only runs of the nightly subset with checked-release can be stored."
              exit 1
            fi
            store=true
          fi
          {
            echo "run=$run"
            echo "tests=${TESTS:-$NIGHTLY_TESTS}"
            echo "profile=$PROFILE"
            echo "store=$store"
          } >> "$GITHUB_OUTPUT"

  build:
    name: OpenHarmony headless build
    needs: setup
    if: ${{ needs.setup.outputs.run == 'true' }}
    timeout-minutes: 90
    # The self-hosted runners labelled servo-ohos-linux have the OpenHarmony SDK and cargo-ohos's
    # LLVM. Runs while the repository variable NO_SELF_HOSTED_RUNNERS is set use GitHub-hosted ones.
    runs-on: ${{ vars.NO_SELF_HOSTED_RUNNERS && 'ubuntu-24.04' || 'servo-ohos-linux' }}
    permissions:
      contents: read
    steps:
      - uses: servo/ci-runners/actions/checkout@b42c96524cdd72126255602c69c4ad649c750ebf
      - name: Setup Python
        if: ${{ runner.environment != 'self-hosted' }}
        uses: ./.github/actions/setup-python
      - name: Change Mirror Priorities
        if: ${{ runner.environment != 'self-hosted' }}
        uses: ./.github/actions/apt-mirrors
      - name: Bootstrap dependencies
        if: ${{ runner.environment != 'self-hosted' }}
        timeout-minutes: 30
        run: |
          sudo apt update
          ./mach bootstrap --yes --skip-lints --skip-nextest --ohos
      - name: Install LLVM and Clang
        if: ${{ runner.environment != 'self-hosted' }}
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1"
          directory: ${{ runner.temp }}/llvm
      - name: Setup OpenHarmony SDK
        if: ${{ runner.environment != 'self-hosted' }}
        id: setup_sdk
        uses: openharmony-rs/setup-ohos-sdk@v1.0.0
        with:
          version: "6.1" # api 23 in openharmony
          fixup-path: true
      # The self-hosted runners set these in their environment.
      - name: Set the OpenHarmony SDK env
        if: ${{ runner.environment != 'self-hosted' }}
        env:
          OHOS_SDK_NATIVE: ${{ steps.setup_sdk.outputs.ohos_sdk_native }}
          OHOS_BASE_SDK_HOME: ${{ steps.setup_sdk.outputs.ohos-base-sdk-home }}
        run: |
          echo "OHOS_SDK_NATIVE=$OHOS_SDK_NATIVE" >> "$GITHUB_ENV"
          echo "OHOS_BASE_SDK_HOME=$OHOS_BASE_SDK_HOME" >> "$GITHUB_ENV"
      # The default features with the RDB storage backend instead of SQLite. `--js-engine quickjs`
      # changes Cargo.lock, so the build is not `--locked`.
      - name: Build
        env:
          PROFILE: ${{ needs.setup.outputs.profile }}
        run: |
          ./mach build --ohos --headless-binary --profile "$PROFILE" --js-engine quickjs \
            --no-default-features --features "base ohos-rdb-backend"
      - name: Upload the headless servoshell
        uses: actions/upload-artifact@v7
        with:
          name: servoshell-headless-aarch64-unknown-linux-ohos
          path: target/aarch64-unknown-linux-ohos/${{ needs.setup.outputs.profile }}/servoshell-headless
          if-no-files-found: error

  wpt:
    name: WPT on the DAYU200
    needs: [setup, build]
    timeout-minutes: 480
    runs-on: servo-ohos-dayu200
    permissions:
      contents: read
    steps:
      - uses: servo/ci-runners/actions/checkout@b42c96524cdd72126255602c69c4ad649c750ebf
      # Where `./mach test-wpt --ohos` looks for it.
      - name: Download the headless servoshell
        uses: actions/download-artifact@v8
        with:
          name: servoshell-headless-aarch64-unknown-linux-ohos
          path: target/aarch64-unknown-linux-ohos/${{ needs.setup.outputs.profile }}/servoshell-headless
      # With one board attached, the runner finds it without --ohos-device. The report has the
      # layout that servo-ohos-wpt's store.yml expects: one chunk.
      - name: Run the tests
        env:
          PROFILE: ${{ needs.setup.outputs.profile }}
          TESTS: ${{ needs.setup.outputs.tests }}
        run: |
          mkdir -p wpt-full-logs/linux/wptreport
          # shellcheck disable=SC2086 # TESTS holds several paths.
          ./mach test-wpt --ohos --profile "$PROFILE" --js-engine quickjs --processes 2 --always-succeed \
            --log-raw wpt-full-logs/raw.log --log-wptreport wpt-full-logs/linux/wptreport/1.json \
            $TESTS
      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: wpt-full-logs-ohos-dayu200
          path: wpt-full-logs
          if-no-files-found: error

  # The called workflow takes its token from the `servo-ohos-wpt` environment, which only ohos-main
  # can use.
  results:
    name: Results
    needs: [setup, wpt]
    if: ${{ needs.setup.outputs.store == 'true' && needs.wpt.result == 'success' }}
    uses: openharmony-rs/servo-ohos-wpt/.github/workflows/store.yml@main
    # The called workflow reads the secret from its job's environment, but only if it is passed.
    secrets:
      SERVO_OHOS_WPT_TOKEN: ${{ secrets.SERVO_OHOS_WPT_TOKEN }}
    with:
      # RESULTS_CONFIG; `with` can't read env.
      artifacts: '{"ohos-dayu200-quickjs": "wpt-full-logs-ohos-dayu200"}'
      chunks: 1
      upstream: false
    permissions: {}
