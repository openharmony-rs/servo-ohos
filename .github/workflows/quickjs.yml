# Builds servoshell on the QuickJS mozjs shim (openharmony-rs/servo-quickjs) and runs WPT with it,
# against the expectations with their `js_engine == "quickjs"` conditions. Pull requests run WPT
# on the directories of the Linux WPT job, and the whole suite when they change the shim pin
# (python/servo/pr_jobs.py); the merge queue runs the build and smoketest only.
name: QuickJS
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
      wpt:
        default: false
        required: false
        type: boolean
      wpt-args:
        default: ""
        required: false
        type: string
      number-of-wpt-chunks:
        default: 20
        required: false
        type: number
  workflow_dispatch:
    inputs:
      servo-quickjs-ref:
        description: Branch, tag or commit of openharmony-rs/servo-quickjs, instead of the pinned commit
        default: ""
        required: false
        type: string
      wpt:
        description: Run WPT
        default: true
        required: false
        type: boolean
      wpt-args:
        description: Extra arguments for `mach test-wpt`, e.g. test paths
        default: ""
        required: false
        type: string

env:
  RUST_BACKTRACE: 1
  SHELL: /bin/bash
  SERVO_QUICKJS_URL: https://github.com/openharmony-rs/servo-quickjs
  # Replaces the servo-quickjs commit pinned in support/quickjs/cargo-config.toml, if set.
  SERVO_QUICKJS_REF: ${{ inputs.servo-quickjs-ref }}
  PROFILE: ${{ inputs.profile || 'release' }}
  RUN_WPT: ${{ github.event_name == 'schedule' || inputs.wpt }}

jobs:
  build:
    name: Linux Build (QuickJS)
    # The WPT runners are Ubuntu 22.04, so build against its glibc, as the self-hosted runners
    # labelled servo-ohos-linux do. Their target directory has the checked-release QuickJS build of
    # a recent ohos-main. Pull requests from forks and runs while the repository variable
    # NO_SELF_HOSTED_RUNNERS is set use GitHub-hosted runners.
    runs-on: ${{ (vars.NO_SELF_HOSTED_RUNNERS || github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-22.04' || 'servo-ohos-linux' }}
    permissions:
      contents: read
    steps:
      - uses: servo/ci-runners/actions/checkout@b42c96524cdd72126255602c69c4ad649c750ebf
      - name: Free Disk Space (Ubuntu)
        if: ${{ runner.environment != 'self-hosted' }}
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: false
          swap-storage: false
      # The self-hosted runners have the same LLVM release, see linux-common.yml.
      - name: Install LLVM and Clang
        if: ${{ runner.environment != 'self-hosted' }}
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1"
          directory: ${{ runner.temp }}/llvm
      - name: Set LIBCLANG_PATH env
        if: ${{ runner.environment != 'self-hosted' }}
        run: echo "LIBCLANG_PATH=${LLVM_PATH}/lib" >> "$GITHUB_ENV"
      - name: Setup Python
        if: ${{ runner.environment != 'self-hosted' }}
        uses: ./.github/actions/setup-python
      - name: Change Mirror Priorities
        if: ${{ runner.environment != 'self-hosted' }}
        uses: ./.github/actions/apt-mirrors
      - name: Bootstrap dependencies
        if: ${{ runner.environment != 'self-hosted' }}
        timeout-minutes: 30
        run: |
          sudo apt update
          ./mach bootstrap --yes --skip-lints --skip-nextest
      - name: Install sccache
        if: ${{ runner.environment != 'self-hosted' && vars.SCCACHE_GHA_ENABLED != 'false' }}
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Enable sccache
        if: ${{ runner.environment != 'self-hosted' && vars.SCCACHE_GHA_ENABLED != 'false' }}
        run: |
          {
            echo "SCCACHE_GHA_VERSION=${{ vars.SCCACHE_GHA_VERSION || '1' }}"
            echo "SCCACHE_GHA_ENABLED=true"
            echo "RUSTC_WRAPPER=sccache"
            echo "CARGO_INCREMENTAL=0"
          } >> "$GITHUB_ENV"
      - name: Use another servo-quickjs commit
        if: ${{ env.SERVO_QUICKJS_REF != '' }}
        run: |
          refs=$(git ls-remote "$SERVO_QUICKJS_URL")
          rev=
          for ref in "refs/tags/$SERVO_QUICKJS_REF^{}" "refs/tags/$SERVO_QUICKJS_REF" "refs/heads/$SERVO_QUICKJS_REF"; do
            rev=$(awk -v ref="$ref" '$2 == ref { print $1 }' <<< "$refs")
            [ -n "$rev" ] && break
          done
          rev=${rev:-$SERVO_QUICKJS_REF}
          if ! [[ $rev =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::$SERVO_QUICKJS_REF is not a branch or tag of $SERVO_QUICKJS_URL, nor a full commit hash"
            exit 1
          fi
          sed -i -E "s/rev = \"[0-9a-f]{40}\"/rev = \"$rev\"/" support/quickjs/cargo-config.toml
          echo "servo-quickjs: \`$SERVO_QUICKJS_REF\` ($rev)" >> "$GITHUB_STEP_SUMMARY"
      # `--js-engine quickjs` changes Cargo.lock, so the build is not `--locked`.
      - name: Build
        run: ./mach build --profile "$PROFILE" --js-engine quickjs
      - name: Smoketest
        run: xvfb-run ./mach smoketest --profile "$PROFILE"
      - name: Build mach package
        if: ${{ env.RUN_WPT == 'true' }}
        run: ./mach package --profile "$PROFILE"
      - name: Upload artifact for mach package
        if: ${{ env.RUN_WPT == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PROFILE }}-binary-quickjs
          path: target/${{ env.PROFILE }}/servo-tech-demo.tar.gz
          if-no-files-found: error

  # Takes the token of the caller, like the Linux WPT job: its report creates a check run and
  # comments on the pull request.
  wpt:
    needs: build
    if: ${{ github.event_name == 'schedule' || inputs.wpt }}
    uses: ./.github/workflows/linux-wpt.yml
    with:
      profile: ${{ inputs.profile || 'release' }}
      binary-path: servo/servoshell
      number-of-wpt-chunks: ${{ inputs.number-of-wpt-chunks || 20 }}
      name: quickjs
      wpt-args: --js-engine quickjs ${{ inputs.wpt-args }}
