name: Lint
on:
  workflow_call:
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  SHELL: /bin/bash
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: Lint
    # The self-hosted runners labelled servo-ohos-linux have the clippy artifacts of a recent
    # ohos-main. Pull requests from forks and runs while the repository variable
    # NO_SELF_HOSTED_RUNNERS is set use GitHub-hosted runners.
    runs-on: ${{ (vars.NO_SELF_HOSTED_RUNNERS || github.event.pull_request.head.repo.fork) && 'ubuntu-22.04' || 'servo-ohos-linux' }}
    steps:
      - uses: servo/ci-runners/actions/checkout@b42c96524cdd72126255602c69c4ad649c750ebf
        with:
          # Fetch all commits, for `mach test-tidy`
          fetch-depth: 0
      # The self-hosted runners have the same LLVM release, see linux-common.yml.
      - name: Install LLVM and Clang
        if: ${{ runner.environment != 'self-hosted' }}
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1"
          directory: ${{ runner.temp }}/llvm
      - name: Set LIBCLANG_PATH env
        if: ${{ runner.environment != 'self-hosted' }}
        run: echo "LIBCLANG_PATH=${LLVM_PATH}/lib" >> $GITHUB_ENV
      - name: Setup Python
        if: ${{ runner.environment != 'self-hosted' }}
        uses: ./.github/actions/setup-python
      - name: Install taplo
        if: ${{ runner.environment != 'self-hosted' }}
        uses: baptiste0928/cargo-install@v3
        with:
          crate: taplo-cli
          locked: true
      - name: Install cargo-deny
        if: ${{ runner.environment != 'self-hosted' }}
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-deny
          version: 0.19.0
          locked: true
      - name: Change Mirror Priorities
        if: ${{ runner.environment != 'self-hosted' }}
        uses: ./.github/actions/apt-mirrors
      - name: Bootstrap dependencies
        if: ${{ runner.environment != 'self-hosted' }}
        timeout-minutes: 30
        run: |
          sudo apt update
          ./mach bootstrap --yes --skip-nextest
      - name: Clippy
        run: |
          ./mach clippy --locked --github-annotations -- -- --deny warnings
      - name: Tidy
        env:
          CI_PULL_REQUEST_BODY: ${{ github.event.pull_request.body }}
        run: ./mach test-tidy --no-progress --all --github-annotations
