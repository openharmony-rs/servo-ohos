[package]
name = "servo-storage"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
description.workspace = true
autotests = false # Inhibit lookup for tests/*.rs without [[test]] sections

[lib]
name = "storage"
path = "lib.rs"

[dependencies]
libc = { workspace = true }
log = { workspace = true }
malloc_size_of = { workspace = true }
malloc_size_of_derive = { workspace = true }
net_traits = { workspace = true }
postcard = { workspace = true }
profile_traits = { workspace = true }
rusqlite = { workspace = true, optional = true }
rustc-hash = { workspace = true }
sea-query = { workspace = true }
sea-query-rusqlite = { workspace = true, optional = true }
serde = { workspace = true }
servo-base = { workspace = true }
servo-config = { workspace = true }
servo-url = { workspace = true }
storage_traits = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_env = "ohos")'.dependencies]
ohos-rdb-sys = { workspace = true, features = ["api-20"], optional = true }

[features]
default = ["sqlite-backend"]
# The bundled SQLite backend. Available on every target, and the only backend
# on non-OHOS ones.
sqlite-backend = ["dep:rusqlite", "dep:sea-query-rusqlite"]
# The OpenHarmony system database backend. Only has an effect on OHOS targets,
# where it can either replace the SQLite backend or, with both enabled, be
# selected at runtime through the `storage_ohos_rdb_backend_enabled` pref.
ohos-rdb-backend = ["dep:ohos-rdb-sys"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(ohos_rdb)'] }

[dev-dependencies]
profile = { workspace = true }
servo-default-resources = { workspace = true }
url = { workspace = true }

[[test]]
name = "main"
path = "tests/main.rs"
